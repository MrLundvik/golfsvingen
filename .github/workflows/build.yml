name: Bygg och publicera APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # Kroppsmodellen ligger inte i repot. Den hämtas från Google och kontrolleras mot sin kontrollsumma
      - name: Kroppsmodell
        env:
          MODEL_URL: https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_heavy/float16/1/pose_landmarker_heavy.task
          MODEL_MD5: 453dec4d02ccc4d3ce812b6de84fa516
        run: |
          mkdir -p app/src/main/assets
          curl -fsSL --retry 3 -o app/src/main/assets/pose_landmarker_heavy.task "$MODEL_URL"
          echo "$MODEL_MD5  app/src/main/assets/pose_landmarker_heavy.task" | md5sum -c -

      - name: Signeringsnyckel
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/golfsvingen.p12
          else
            echo "Ingen nyckel, appen signeras med en tillfällig nyckel"
          fi

      - name: Bygg
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle --no-daemon assembleRelease

      - name: Publicera som release
        env:
          GH_TOKEN: ${{ github.token }}
          # Via miljövariabel, så att tecken i commit-meddelandet inte tolkas som skal-kod
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          # Samma version står i app/build.gradle.kts
          TAG="v0.4.${{ github.run_number }}"
          APK="Golfsvingen-$TAG.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          printf 'Öppna den här sidan på telefonen, ladda ned %s och installera.\n\nÄndringar:\n%s\n' "$APK" "$COMMIT_MSG" > notes.md
          gh release create "$TAG" "$APK" --title "Golfsvingen $TAG" --notes-file notes.md --latest
